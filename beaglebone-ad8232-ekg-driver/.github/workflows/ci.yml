name: AD8232 BeagleBone Driver CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: PYTHONPATH=src python3 -m unittest discover tests -v
      - name: Run simulated capture
        run: PYTHONPATH=src python3 -m ad8232_bbb_driver.cli --simulate --duration-seconds 4 --output-dir artifacts
      - name: Validate artifacts
        run: |
          test -s artifacts/ad8232_capture.csv
          test -s artifacts/ad8232_report.json

