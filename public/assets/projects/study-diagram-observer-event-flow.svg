<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Observer Event Flow</title>
  <desc id="desc">Observer pattern diagram showing sensor events fanning out to logging, UI, and alert subscribers.</desc>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect x="64" y="54" width="1072" height="522" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="96" y="112" fill="#0f172a" font-family="Arial, sans-serif" font-size="34" font-weight="700">Observer Event Flow</text>
  <text x="96" y="148" fill="#475569" font-family="Arial, sans-serif" font-size="18">Publishers emit state changes without knowing which subscribers react to them.</text>
  <rect x="100" y="260" width="240" height="110" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="145" y="310" fill="#166534" font-family="Arial, sans-serif" font-size="24" font-weight="700">SensorSubject</text>
  <text x="152" y="344" fill="#15803d" font-family="Arial, sans-serif" font-size="17">notify(event)</text>
  <g font-family="Arial, sans-serif" font-weight="700">
    <rect x="840" y="176" width="230" height="68" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="900" y="218" fill="#1e3a8a" font-size="18">LogObserver</text>
    <rect x="840" y="282" width="230" height="68" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
    <text x="914" y="324" fill="#92400e" font-size="18">UiObserver</text>
    <rect x="840" y="388" width="230" height="68" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <text x="892" y="430" fill="#991b1b" font-size="18">AlertObserver</text>
  </g>
  <rect x="478" y="260" width="250" height="110" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
  <text x="535" y="310" fill="#334155" font-family="Arial, sans-serif" font-size="23" font-weight="700">Observer List</text>
  <text x="528" y="344" fill="#64748b" font-family="Arial, sans-serif" font-size="17">subscribe / detach</text>
  <g stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M340 315h138"/>
    <path d="M728 315h110"/>
    <path d="M728 315c54 0 62-105 112-105"/>
    <path d="M728 315c54 0 62 105 112 105"/>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker></defs>
</svg>
