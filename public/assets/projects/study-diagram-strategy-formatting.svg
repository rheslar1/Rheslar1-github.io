<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Strategy Formatting Diagram</title>
  <desc id="desc">Strategy pattern diagram showing a logger or report context delegating formatting to interchangeable strategies.</desc>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect x="64" y="54" width="1072" height="522" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="96" y="112" fill="#0f172a" font-family="Arial, sans-serif" font-size="34" font-weight="700">Strategy Pattern: Formatting</text>
  <text x="96" y="148" fill="#475569" font-family="Arial, sans-serif" font-size="18">The context keeps one stable contract while output policies vary behind an interface.</text>
  <rect x="102" y="238" width="250" height="142" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="142" y="294" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="25" font-weight="700">ReportContext</text>
  <text x="136" y="330" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="17">uses Formatter</text>
  <rect x="486" y="238" width="230" height="142" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
  <text x="528" y="292" fill="#166534" font-family="Arial, sans-serif" font-size="24" font-weight="700">Formatter</text>
  <text x="524" y="330" fill="#15803d" font-family="Arial, sans-serif" font-size="17">format(message)</text>
  <g font-family="Arial, sans-serif" font-weight="700">
    <rect x="836" y="178" width="224" height="68" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
    <text x="890" y="220" fill="#92400e" font-size="18">JsonFormatter</text>
    <rect x="836" y="282" width="224" height="68" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text x="888" y="324" fill="#5b21b6" font-size="18">TextFormatter</text>
    <rect x="836" y="386" width="224" height="68" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
    <text x="884" y="428" fill="#075985" font-size="18">TableFormatter</text>
  </g>
  <g stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M352 309h134"/>
    <path d="M716 309h118"/>
    <path d="M716 309c54 0 68-97 120-97"/>
    <path d="M716 309c54 0 68 97 120 97"/>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker></defs>
</svg>
