  <text x="520" y="462" fill="#e5e7eb" font-family="monospace" font-size="21">rheslar@gmail.com</text>
  <text x="100" y="546" fill="#fbbf24" font-family="Arial, sans-serif" font-size="22" font-weight="700">Simulated view: CSV-backed user workflow from main.py, db.py, and Userclass.py</text>
