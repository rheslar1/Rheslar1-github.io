  <text x="100" y="146" fill="#93c5fd" font-family="monospace" font-size="22">$ python main.py</text>
  <text x="100" y="190" fill="#e5e7eb" font-family="monospace" font-size="22">1. show users</text>
  <text x="100" y="224" fill="#e5e7eb" font-family="monospace" font-size="22">2. add user</text>
  <text x="100" y="258" fill="#e5e7eb" font-family="monospace" font-size="22">3. del user</text>
  <text x="100" y="292" fill="#e5e7eb" font-family="monospace" font-size="22">4. exit</text>
  <text x="100" y="344" fill="#93c5fd" font-family="monospace" font-size="22">command &gt; show users</text>
  <rect x="100" y="376" width="1000" height="132" rx="8" fill="#0f172a" stroke="#334155"/>
