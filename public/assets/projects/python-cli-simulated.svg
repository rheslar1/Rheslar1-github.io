  <title id="title">Simulated pythonProject CLI Screenshot</title>
  <desc id="desc">Simulated terminal view for the pythonProject command-line user management workflow.</desc>
  <rect width="1200" height="630" fill="#f6f8fb"/>
  <rect x="70" y="54" width="1060" height="522" rx="10" fill="#111827"/>
  <rect x="70" y="54" width="1060" height="46" rx="10" fill="#1f2937"/>
  <circle cx="102" cy="77" r="7" fill="#ef4444"/>
  <circle cx="126" cy="77" r="7" fill="#f59e0b"/>
  <circle cx="150" cy="77" r="7" fill="#10b981"/>
