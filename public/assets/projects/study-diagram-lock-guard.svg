<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Lock Guard Scoped Mutex</title>
  <desc id="desc">Concurrency diagram showing scoped lock ownership with a lock guard around a shared resource.</desc>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect x="64" y="54" width="1072" height="522" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="96" y="112" fill="#0f172a" font-family="Arial, sans-serif" font-size="34" font-weight="700">Lock Guard Scoped Mutex</text>
  <text x="96" y="148" fill="#475569" font-family="Arial, sans-serif" font-size="18">A lock guard acquires the mutex at scope entry and releases it automatically at scope exit.</text>
  <rect x="112" y="230" width="220" height="96" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="166" y="286" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="22" font-weight="700">Worker A</text>
  <rect x="112" y="386" width="220" height="96" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="166" y="442" fill="#991b1b" font-family="Arial, sans-serif" font-size="22" font-weight="700">Worker B</text>
  <rect x="468" y="268" width="248" height="156" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
  <text x="526" y="326" fill="#92400e" font-family="Arial, sans-serif" font-size="24" font-weight="700">std::lock_guard</text>
  <text x="530" y="362" fill="#b45309" font-family="Arial, sans-serif" font-size="17">mutex locked in scope</text>
  <rect x="858" y="268" width="220" height="156" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="916" y="326" fill="#166534" font-family="Arial, sans-serif" font-size="24" font-weight="700">Shared</text>
  <text x="904" y="362" fill="#15803d" font-family="Arial, sans-serif" font-size="17">state / queue</text>
  <g stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M332 278h136"/>
    <path d="M332 434c74 0 76-88 136-88"/>
    <path d="M716 346h142"/>
  </g>
  <text x="468" y="494" fill="#334155" font-family="Arial, sans-serif" font-size="20" font-weight="700">Critical section ends cleanly, even with early returns.</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker></defs>
</svg>
