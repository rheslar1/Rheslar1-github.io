<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">BEMS Energy Heat Map and Usage</title>
  <desc id="desc">Simulated BEMS dashboard showing zone energy intensity, usage, comfort risk, and BEMS-ai optimization actions.</desc>
  <rect width="1200" height="630" fill="#071936"/>
  <rect x="52" y="44" width="1096" height="542" rx="14" fill="#0b1f3a" stroke="#24507d" stroke-width="2"/>
  <text x="86" y="100" fill="#eef6ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">BEMS Energy Heat Map + Usage</text>
  <text x="86" y="136" fill="#b7d2f2" font-family="Arial, sans-serif" font-size="18">Simulated BEMS zone energy intensity, usage trend, and BEMS-ai optimization actions</text>

  <defs>
    <style>
      .zoneLabel { fill: #eef6ff; font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; }
      .zoneMeta { fill: #dceeff; font-family: Arial, sans-serif; font-size: 15px; }
      .panelText { fill: #b7d2f2; font-family: Arial, sans-serif; font-size: 16px; }
      .panelTitle { fill: #eef6ff; font-family: Arial, sans-serif; font-size: 20px; font-weight: 700; }
    </style>
  </defs>

  <rect x="86" y="178" width="676" height="350" rx="10" fill="#102b52" stroke="#24507d"/>
  <rect x="116" y="210" width="278" height="110" rx="8" fill="#0ea5e9"/>
  <text class="zoneLabel" x="142" y="248">Lobby</text>
  <text class="zoneMeta" x="142" y="280">8.4 kWh | 21.9 C</text>
  <text class="zoneMeta" x="142" y="304">BEMS-ai: hold setpoint</text>

  <rect x="426" y="210" width="286" height="110" rx="8" fill="#f59e0b"/>
  <text class="zoneLabel" x="452" y="248">Floor 1</text>
  <text class="zoneMeta" x="452" y="280">18.7 kWh | 23.4 C</text>
  <text class="zoneMeta" x="452" y="304">BEMS-ai: trim airflow</text>

  <rect x="116" y="350" width="196" height="126" rx="8" fill="#38bdf8"/>
  <text class="zoneLabel" x="140" y="390">Floor 2</text>
  <text class="zoneMeta" x="140" y="422">11.2 kWh</text>
  <text class="zoneMeta" x="140" y="448">BEMS-ai: maintain</text>

  <rect x="344" y="350" width="168" height="126" rx="8" fill="#22c55e"/>
  <text class="zoneLabel" x="368" y="390">Tower B Lobby</text>
  <text class="zoneMeta" x="368" y="422">5.6 kWh</text>
  <text class="zoneMeta" x="368" y="448">BEMS-ai: low load</text>

  <rect x="544" y="350" width="168" height="126" rx="8" fill="#ef4444"/>
  <text class="zoneLabel" x="568" y="390">Tower B Floor 1</text>
  <text class="zoneMeta" x="568" y="422">24.1 kWh</text>
  <text class="zoneMeta" x="568" y="448">BEMS-ai: high risk</text>

  <rect x="802" y="178" width="286" height="350" rx="10" fill="#102b52" stroke="#24507d"/>
  <text class="panelTitle" x="832" y="226">Usage + BEMS-ai Readout</text>
  <text class="panelText" x="832" y="272">Peak zone: Tower B Floor 1</text>
  <text class="panelText" x="832" y="310">Current load: 68.0 kWh</text>
  <text class="panelText" x="832" y="348">Estimated savings: 18 kWh</text>
  <text class="panelText" x="832" y="386">Comfort risk: moderate</text>
  <text class="panelText" x="832" y="424">BEMS-ai: shift load + trim airflow</text>
  <rect x="832" y="454" width="24" height="34" rx="4" fill="#0ea5e9"/>
  <rect x="866" y="432" width="24" height="56" rx="4" fill="#2563eb"/>
  <rect x="900" y="404" width="24" height="84" rx="4" fill="#f59e0b"/>
  <rect x="934" y="378" width="24" height="110" rx="4" fill="#ef4444"/>
  <rect x="968" y="420" width="24" height="68" rx="4" fill="#2563eb"/>
  <rect x="1002" y="446" width="24" height="42" rx="4" fill="#0ea5e9"/>
  <text class="panelText" x="832" y="514">Usage trend: 06:00 to 21:00</text>

  <rect x="86" y="548" width="56" height="16" rx="8" fill="#22c55e"/>
  <rect x="156" y="548" width="56" height="16" rx="8" fill="#38bdf8"/>
  <rect x="226" y="548" width="56" height="16" rx="8" fill="#0ea5e9"/>
  <rect x="296" y="548" width="56" height="16" rx="8" fill="#f59e0b"/>
  <rect x="366" y="548" width="56" height="16" rx="8" fill="#ef4444"/>
  <text x="440" y="562" fill="#b7d2f2" font-family="Arial, sans-serif" font-size="16">Low to high energy intensity</text>
  <text x="86" y="592" fill="#b7d2f2" font-family="Arial, sans-serif" font-size="16">Simulated heat map and usage view based on BEMS zones, MySQL device schema, React dashboard, and BEMS-ai optimization workflow.</text>
</svg>
