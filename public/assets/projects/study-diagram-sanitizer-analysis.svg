<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Sanitizer And Static Analysis Workflow</title>
  <desc id="desc">Validation workflow diagram showing CMake build, CTest, clang-tidy, cppcheck, CodeChecker, and sanitizer runs.</desc>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect x="64" y="54" width="1072" height="522" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="96" y="112" fill="#0f172a" font-family="Arial, sans-serif" font-size="34" font-weight="700">Sanitizer And Static Analysis Workflow</text>
  <text x="96" y="148" fill="#475569" font-family="Arial, sans-serif" font-size="18">C++ examples move through build, test, static analysis, dynamic checks, and artifact capture.</text>
  <g font-family="Arial, sans-serif" font-weight="700">
    <rect x="96" y="260" width="150" height="82" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="136" y="310" fill="#1e3a8a" font-size="18">CMake</text>
    <rect x="296" y="260" width="150" height="82" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="348" y="310" fill="#166534" font-size="18">CTest</text>
    <rect x="496" y="260" width="150" height="82" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/><text x="528" y="310" fill="#92400e" font-size="18">clang-tidy</text>
    <rect x="696" y="260" width="150" height="82" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="732" y="310" fill="#5b21b6" font-size="18">cppcheck</text>
    <rect x="896" y="260" width="186" height="82" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="934" y="310" fill="#991b1b" font-size="18">Sanitizers</text>
  </g>
  <g stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M246 301h50"/><path d="M446 301h50"/><path d="M646 301h50"/><path d="M846 301h50"/>
  </g>
  <rect x="352" y="426" width="496" height="76" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="392" y="458" fill="#334155" font-family="Arial, sans-serif" font-size="20" font-weight="700">CodeChecker / Clang Static Analyzer report uploaded as artifact</text>
  <text x="392" y="486" fill="#64748b" font-family="Arial, sans-serif" font-size="16">The study repo documents both compile-time and runtime validation practice.</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker></defs>
</svg>
