<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Factory Device Selection</title>
  <desc id="desc">Factory method diagram for constructing camera, sensor, or mock hardware implementations from configuration.</desc>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect x="64" y="54" width="1072" height="522" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="96" y="112" fill="#0f172a" font-family="Arial, sans-serif" font-size="34" font-weight="700">Factory Method: Device Selection</text>
  <text x="96" y="148" fill="#475569" font-family="Arial, sans-serif" font-size="18">Configuration selects a concrete hardware adapter through a stable factory interface.</text>
  <rect x="96" y="254" width="216" height="120" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
  <text x="146" y="304" fill="#334155" font-family="Arial, sans-serif" font-size="24" font-weight="700">Config</text>
  <text x="132" y="338" fill="#64748b" font-family="Arial, sans-serif" font-size="17">device = camera</text>
  <rect x="442" y="254" width="250" height="120" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="496" y="304" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="24" font-weight="700">DeviceFactory</text>
  <text x="506" y="338" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="17">create(config)</text>
  <g font-family="Arial, sans-serif" font-weight="700">
    <rect x="824" y="176" width="244" height="68" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="892" y="218" fill="#166534" font-size="18">CameraDevice</text>
    <rect x="824" y="282" width="244" height="68" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
    <text x="900" y="324" fill="#92400e" font-size="18">SensorDevice</text>
    <rect x="824" y="388" width="244" height="68" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text x="912" y="430" fill="#5b21b6" font-size="18">MockDevice</text>
  </g>
  <g stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M312 314h130"/>
    <path d="M692 314h130"/>
    <path d="M692 314c54 0 78-104 132-104"/>
    <path d="M692 314c54 0 78 104 132 104"/>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker></defs>
</svg>
