<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Simulated Ansible Playbook Run</title>
  <desc id="desc">Simulated terminal output for Ansible playbook validation and remote command execution.</desc>
  <rect width="1200" height="630" fill="#f6f8fb"/>
  <rect x="72" y="64" width="1056" height="500" rx="10" fill="#111827"/>
  <rect x="72" y="64" width="1056" height="48" rx="10" fill="#1f2937"/>
  <circle cx="104" cy="88" r="7" fill="#ef4444"/>
  <circle cx="128" cy="88" r="7" fill="#f59e0b"/>
  <circle cx="152" cy="88" r="7" fill="#10b981"/>
  <text x="188" y="95" fill="#d1d5db" font-family="Arial, sans-serif" font-size="17" font-weight="700">ansible - simulated playbook output</text>
  <text x="104" y="162" fill="#93c5fd" font-family="monospace" font-size="21">$ ansible-playbook -i playbooks/inventory/ansible-hosts playbooks/helloworld.yml</text>
  <text x="104" y="216" fill="#f8fafc" font-family="monospace" font-size="22">PLAY [Validate automation baseline] *********************************</text>
  <text x="104" y="270" fill="#d1fae5" font-family="monospace" font-size="22">TASK [hello world debug] ok: [localhost]</text>
  <text x="104" y="324" fill="#93c5fd" font-family="monospace" font-size="21">$ ansible-playbook -i playbooks/inventory/ansible-hosts test.yml</text>
  <text x="104" y="378" fill="#d1fae5" font-family="monospace" font-size="22">TASK [ping] ok: [localhost] =&gt; pong</text>
  <text x="104" y="432" fill="#f8fafc" font-family="monospace" font-size="22">PLAY RECAP ***********************************************************</text>
  <text x="104" y="486" fill="#d1fae5" font-family="monospace" font-size="22">localhost : ok=3 changed=0 unreachable=0 failed=0</text>
  <text x="104" y="536" fill="#fbbf24" font-family="Arial, sans-serif" font-size="21" font-weight="700">Simulated view: playbook validation, inventory checks, and remote automation workflow.</text>
</svg>
