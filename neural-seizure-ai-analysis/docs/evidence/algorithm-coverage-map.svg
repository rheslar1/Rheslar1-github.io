  <text x="58" y="64" font-family="Arial" font-size="13" fill="#475569">Dependency-free implementation coverage for the Predictive AI Neural Seizure Analysis project.</text>
  <rect x="58" y="96" width="1004" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1"/><rect x="58" y="96" width="8" height="44" rx="4" fill="#2563eb"/><text x="82" y="114" font-family="Arial" font-size="15" font-weight="700" fill="#0f172a">EEG acquisition</text><text x="338" y="114" font-family="Arial" font-size="13" fill="#475569">EEG/ECoG/iEEG/microarray synthetic profiles</text><rect x="58" y="154" width="1004" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1"/><rect x="58" y="154" width="8" height="44" rx="4" fill="#0f766e"/><text x="82" y="172" font-family="Arial" font-size="15" font-weight="700" fill="#0f172a">Preprocessing</text><text x="338" y="172" font-family="Arial" font-size="13" fill="#475569">baseline removal, normalization, windowing</text><rect x="58" y="212" width="1004" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1"/><rect x="58" y="212" width="8" height="44" rx="4" fill="#7c3aed"/><text x="82" y="230" font-family="Arial" font-size="15" font-weight="700" fill="#0f172a">Time-frequency</text><text x="338" y="230" font-family="Arial" font-size="13" fill="#475569">bandpower, HFO, Haar wavelet detail energy</text><rect x="58" y="270" width="1004" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1"/><rect x="58" y="270" width="8" height="44" rx="4" fill="#dc2626"/><text x="82" y="288" font-family="Arial" font-size="15" font-weight="700" fill="#0f172a">Nonlinear statistics</text><text x="338" y="288" font-family="Arial" font-size="13" fill="#475569">sample entropy, wavelet entropy, Katz/Higuchi FD</text><rect x="58" y="328" width="1004" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1"/><rect x="58" y="328" width="8" height="44" rx="4" fill="#ea580c"/><text x="82" y="346" font-family="Arial" font-size="15" font-weight="700" fill="#0f172a">Connectivity</text><text x="338" y="346" font-family="Arial" font-size="13" fill="#475569">Pearson channel graph, spread, spatial concentration</text><rect x="58" y="386" width="1004" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1"/><rect x="58" y="386" width="8" height="44" rx="4" fill="#0891b2"/><text x="82" y="404" font-family="Arial" font-size="15" font-weight="700" fill="#0f172a">Deep model proxies</text><text x="338" y="404" font-family="Arial" font-size="13" fill="#475569">CNN, LSTM, transformer, GNN teacher heuristics</text><rect x="58" y="444" width="1004" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1"/><rect x="58" y="444" width="8" height="44" rx="4" fill="#4d7c0f"/><text x="82" y="462" font-family="Arial" font-size="15" font-weight="700" fill="#0f172a">Distillation</text><text x="338" y="462" font-family="Arial" font-size="13" fill="#475569">logistic edge student + C export</text><rect x="58" y="502" width="1004" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1"/><rect x="58" y="502" width="8" height="44" rx="4" fill="#9333ea"/><text x="82" y="520" font-family="Arial" font-size="15" font-weight="700" fill="#0f172a">Post-processing</text><text x="338" y="520" font-family="Arial" font-size="13" fill="#475569">EMA hysteresis, SPH, SOH, false-warning control</text><rect x="58" y="560" width="1004" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1"/><rect x="58" y="560" width="8" height="44" rx="4" fill="#0f766e"/><text x="82" y="578" font-family="Arial" font-size="15" font-weight="700" fill="#0f172a">Multimodal context</text><text x="338" y="578" font-family="Arial" font-size="13" fill="#475569">BeagleBone AD8232 EKG/ECG auxiliary fusion</text><rect x="58" y="618" width="1004" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1"/><rect x="58" y="618" width="8" height="44" rx="4" fill="#334155"/><text x="82" y="636" font-family="Arial" font-size="15" font-weight="700" fill="#0f172a">Safety/XAI</text><text x="338" y="636" font-family="Arial" font-size="13" fill="#475569">feature contribution evidence and research-only gates</text>
  <text x="58" y="690" font-family="Arial" font-size="12" fill="#64748b">Research simulation only. Not for diagnosis, monitoring, treatment, or autonomous intervention.</text>
