<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Startup And Cleanup Sequence</title>
  <desc id="desc">Sequence diagram showing service initialization, worker start, stop request, and deterministic cleanup.</desc>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect x="64" y="54" width="1072" height="522" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="96" y="112" fill="#0f172a" font-family="Arial, sans-serif" font-size="34" font-weight="700">Startup And Cleanup Sequence</text>
  <text x="96" y="148" fill="#475569" font-family="Arial, sans-serif" font-size="18">Lifecycle steps keep initialization, run state, shutdown, and cleanup explicit.</text>
  <g stroke="#94a3b8" stroke-width="3">
    <line x1="180" y1="216" x2="180" y2="516" stroke-dasharray="8 8"/>
    <line x1="420" y1="216" x2="420" y2="516" stroke-dasharray="8 8"/>
    <line x1="660" y1="216" x2="660" y2="516" stroke-dasharray="8 8"/>
    <line x1="900" y1="216" x2="900" y2="516" stroke-dasharray="8 8"/>
  </g>
  <g font-family="Arial, sans-serif" font-weight="700">
    <text x="132" y="202" fill="#1e3a8a" font-size="20">Main</text>
    <text x="366" y="202" fill="#166534" font-size="20">Service</text>
    <text x="600" y="202" fill="#92400e" font-size="20">Worker</text>
    <text x="846" y="202" fill="#5b21b6" font-size="20">Resource</text>
  </g>
  <g stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M180 252h240"/>
    <path d="M420 306h240"/>
    <path d="M660 360h240"/>
    <path d="M900 420H660"/>
    <path d="M660 474H420"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="17" fill="#334155">
    <text x="238" y="238">configure()</text>
    <text x="484" y="292">start()</text>
    <text x="724" y="346">acquire()</text>
    <text x="724" y="408">release()</text>
    <text x="486" y="462">join + cleanup</text>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker></defs>
</svg>
