<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">BEMS Simulated Building Floorplan Energy Heat Map and Usage</title>
  <desc id="desc">Simulated BEMS dashboard showing zone energy intensity, usage, comfort risk, and BEMS-ai optimization actions over a simulated building floorplan.</desc>
  <rect width="1200" height="630" fill="#071936"/>
  <rect x="52" y="44" width="1096" height="542" rx="14" fill="#0b1f3a" stroke="#24507d" stroke-width="2"/>
  <text x="86" y="100" fill="#eef6ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">BEMS Simulated Floorplan Heat Map + Usage</text>
  <text x="86" y="136" fill="#b7d2f2" font-family="Arial, sans-serif" font-size="18">Energy intensity and usage trend over a simulated building floorplan with BEMS-ai optimization actions</text>

  <defs>
    <style>
      .zoneLabel { fill: #eef6ff; font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; }
      .zoneMeta { fill: #dceeff; font-family: Arial, sans-serif; font-size: 15px; }
      .panelText { fill: #b7d2f2; font-family: Arial, sans-serif; font-size: 16px; }
      .panelTitle { fill: #eef6ff; font-family: Arial, sans-serif; font-size: 20px; font-weight: 700; }
    </style>
  </defs>

  <rect x="86" y="178" width="676" height="350" rx="10" fill="#102b52" stroke="#24507d"/>
  <text class="panelText" x="116" y="204">Simulated building floorplan overlay</text>

  <rect x="116" y="222" width="260" height="108" rx="4" fill="#0ea5e9" stroke="#eef6ff" stroke-width="2"/>
  <text class="zoneLabel" x="142" y="258">Lobby</text>
  <text class="zoneMeta" x="142" y="288">8.4 kWh | 21.9 C</text>
  <text class="zoneMeta" x="142" y="312">BEMS-ai: hold setpoint</text>

  <rect x="402" y="222" width="310" height="158" rx="4" fill="#f59e0b" stroke="#eef6ff" stroke-width="2"/>
  <text class="zoneLabel" x="428" y="260">Floor 1</text>
  <text class="zoneMeta" x="428" y="292">18.7 kWh | 23.4 C</text>
  <text class="zoneMeta" x="428" y="318">BEMS-ai: trim airflow</text>

  <rect x="116" y="358" width="190" height="118" rx="4" fill="#2563eb" stroke="#eef6ff" stroke-width="2"/>
  <text class="zoneLabel" x="140" y="396">Floor 2</text>
  <text class="zoneMeta" x="140" y="428">11.2 kWh</text>
  <text class="zoneMeta" x="140" y="452">BEMS-ai: maintain</text>

  <rect x="326" y="358" width="50" height="118" rx="4" fill="#0b1f3a" stroke="#b7d2f2" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="337" y="406" fill="#b7d2f2" font-family="Arial, sans-serif" font-size="14" font-weight="700" transform="rotate(90 337 406)">CORE</text>

  <rect x="402" y="404" width="140" height="72" rx="4" fill="#22c55e" stroke="#eef6ff" stroke-width="2"/>
  <text class="zoneLabel" x="420" y="434">Tower B Lobby</text>
  <text class="zoneMeta" x="420" y="462">5.6 kWh</text>

  <rect x="562" y="404" width="150" height="72" rx="4" fill="#ef4444" stroke="#eef6ff" stroke-width="2"/>
  <text class="zoneLabel" x="580" y="432">Tower B Floor 1</text>
  <text class="zoneMeta" x="580" y="462">24.1 kWh | high</text>

  <rect x="802" y="178" width="286" height="350" rx="10" fill="#102b52" stroke="#24507d"/>
  <text class="panelTitle" x="832" y="226">Usage + BEMS-ai Readout</text>
  <text class="panelText" x="832" y="272">Peak zone: Tower B Floor 1</text>
  <text class="panelText" x="832" y="310">Current load: 68.0 kWh</text>
  <text class="panelText" x="832" y="348">Estimated savings: 18 kWh</text>
  <text class="panelText" x="832" y="386">Comfort risk: moderate</text>
  <text class="panelText" x="832" y="424">BEMS-ai: shift load + trim airflow</text>
  <rect x="832" y="454" width="24" height="34" rx="4" fill="#0ea5e9"/>
  <rect x="866" y="432" width="24" height="56" rx="4" fill="#2563eb"/>
  <rect x="900" y="404" width="24" height="84" rx="4" fill="#f59e0b"/>
  <rect x="934" y="378" width="24" height="110" rx="4" fill="#ef4444"/>
  <rect x="968" y="420" width="24" height="68" rx="4" fill="#2563eb"/>
  <rect x="1002" y="446" width="24" height="42" rx="4" fill="#0ea5e9"/>
  <text class="panelText" x="832" y="514">Usage trend: 06:00 to 21:00</text>

  <rect x="86" y="548" width="56" height="16" rx="8" fill="#22c55e"/>
  <rect x="156" y="548" width="56" height="16" rx="8" fill="#38bdf8"/>
  <rect x="226" y="548" width="56" height="16" rx="8" fill="#0ea5e9"/>
  <rect x="296" y="548" width="56" height="16" rx="8" fill="#f59e0b"/>
  <rect x="366" y="548" width="56" height="16" rx="8" fill="#ef4444"/>
  <text x="440" y="562" fill="#b7d2f2" font-family="Arial, sans-serif" font-size="16">Low to high energy intensity</text>
  <text x="86" y="592" fill="#b7d2f2" font-family="Arial, sans-serif" font-size="16">Simulated heat map and usage view over a simulated BEMS floorplan, MySQL device schema, React dashboard, and BEMS-ai optimization workflow.</text>
</svg>
