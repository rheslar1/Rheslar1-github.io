<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Predictive neural seizure AI pipeline</title>
  <desc id="desc">Architecture visual for high-bandwidth neural sensing, AI seizure forecasting, knowledge distillation, edge inference, and closed-loop intervention review.</desc>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <rect x="56" y="52" width="1088" height="656" rx="8" fill="#ffffff" stroke="#cbd5e1"/>

  <text x="86" y="112" fill="#0f172a" font-family="Arial, sans-serif" font-size="38" font-weight="700">Predictive AI Neural Seizure Analysis</text>
  <text x="86" y="150" fill="#475569" font-family="Arial, sans-serif" font-size="19">High-bandwidth neural sensors, pre-ictal biomarkers, edge AI, and clinical safety review</text>

  <g font-family="Arial, sans-serif">
    <rect x="86" y="210" width="220" height="142" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="112" y="254" fill="#075985" font-size="24" font-weight="700">Neural Sensors</text>
    <text x="112" y="292" fill="#0f172a" font-size="17">EEG / ECoG / iEEG</text>
    <text x="112" y="321" fill="#0f172a" font-size="17">Microelectrode arrays</text>

    <rect x="356" y="210" width="220" height="142" rx="8" fill="#ecfdf5" stroke="#059669"/>
    <text x="382" y="254" fill="#065f46" font-size="24" font-weight="700">Signal Features</text>
    <text x="382" y="292" fill="#0f172a" font-size="17">HFOs and coupling</text>
    <text x="382" y="321" fill="#0f172a" font-size="17">Pre-ictal patterns</text>

    <rect x="626" y="210" width="220" height="142" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="652" y="254" fill="#92400e" font-size="24" font-weight="700">AI Models</text>
    <text x="652" y="292" fill="#0f172a" font-size="17">CNN / LSTM</text>
    <text x="652" y="321" fill="#0f172a" font-size="17">Transformer / GNN</text>

    <rect x="896" y="210" width="220" height="142" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="922" y="254" fill="#991b1b" font-size="24" font-weight="700">Prediction</text>
    <text x="922" y="292" fill="#0f172a" font-size="17">Seizure forecast</text>
    <text x="922" y="321" fill="#0f172a" font-size="17">Latency and FPR review</text>

    <path d="M306 281 H356" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M576 281 H626" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M846 281 H896" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="180" y="438" width="240" height="140" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="206" y="482" fill="#334155" font-size="23" font-weight="700">Knowledge Distillation</text>
    <text x="206" y="520" fill="#0f172a" font-size="17">Teacher-to-student model</text>
    <text x="206" y="549" fill="#0f172a" font-size="17">Lower power edge inference</text>

    <rect x="480" y="438" width="240" height="140" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="506" y="482" fill="#166534" font-size="23" font-weight="700">Embedded Edge Runtime</text>
    <text x="506" y="520" fill="#0f172a" font-size="17">Wearable or implant target</text>
    <text x="506" y="549" fill="#0f172a" font-size="17">Real-time inference boundary</text>

    <rect x="780" y="438" width="240" height="140" rx="8" fill="#fff7ed" stroke="#ea580c"/>
    <text x="806" y="482" fill="#9a3412" font-size="23" font-weight="700">Closed-Loop Review</text>
    <text x="806" y="520" fill="#0f172a" font-size="17">Alert or stimulation decision</text>
    <text x="806" y="549" fill="#0f172a" font-size="17">Ethics and safety controls</text>

    <path d="M420 508 H480" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M720 508 H780" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="17" fill="#334155">
    <rect x="86" y="630" width="1030" height="48" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="112" y="661">Portfolio artifact: research architecture and implementation plan, not a clinical deployment or medical advice.</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
