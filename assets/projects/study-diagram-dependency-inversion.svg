<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Dependency Inversion Boundary</title>
  <desc id="desc">Dependency inversion diagram showing application services depending on interfaces rather than concrete hardware implementations.</desc>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect x="64" y="54" width="1072" height="522" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="96" y="112" fill="#0f172a" font-family="Arial, sans-serif" font-size="34" font-weight="700">Dependency Inversion Boundary</text>
  <text x="96" y="148" fill="#475569" font-family="Arial, sans-serif" font-size="18">High-level services consume abstractions; low-level drivers plug in behind interfaces.</text>
  <rect x="100" y="230" width="280" height="170" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="148" y="294" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="25" font-weight="700">ControlService</text>
  <text x="134" y="330" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="17">business flow / policies</text>
  <rect x="472" y="230" width="260" height="170" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
  <text x="526" y="294" fill="#166534" font-family="Arial, sans-serif" font-size="25" font-weight="700">IHardwareIO</text>
  <text x="516" y="330" fill="#15803d" font-family="Arial, sans-serif" font-size="17">read(), write(), reset()</text>
  <rect x="824" y="176" width="238" height="86" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
  <text x="886" y="228" fill="#92400e" font-family="Arial, sans-serif" font-size="19" font-weight="700">LinuxGPIO</text>
  <rect x="824" y="308" width="238" height="86" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
  <text x="890" y="360" fill="#5b21b6" font-family="Arial, sans-serif" font-size="19" font-weight="700">MockGPIO</text>
  <g stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M380 315h92"/>
    <path d="M732 315h88"/>
    <path d="M732 315c42 0 50-96 92-96"/>
  </g>
  <text x="434" y="462" fill="#334155" font-family="Arial, sans-serif" font-size="20" font-weight="700">Testable boundaries without rewriting the service</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker></defs>
</svg>
