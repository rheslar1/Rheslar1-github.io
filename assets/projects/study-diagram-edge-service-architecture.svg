<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Modular Edge Service Architecture</title>
  <desc id="desc">Architecture diagram tying configuration, logging, RAII handles, network probing, worker lifecycle, and hardware I/O together.</desc>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect x="64" y="54" width="1072" height="522" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="96" y="112" fill="#0f172a" font-family="Arial, sans-serif" font-size="34" font-weight="700">Modular Edge Service Architecture</text>
  <text x="96" y="148" fill="#475569" font-family="Arial, sans-serif" font-size="18">Study architecture separates runtime concerns into replaceable modules with explicit ownership.</text>
  <rect x="452" y="246" width="296" height="132" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="510" y="300" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="25" font-weight="700">EdgeService</text>
  <text x="502" y="336" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="17">orchestrates lifecycle</text>
  <g font-family="Arial, sans-serif" font-weight="700">
    <rect x="100" y="192" width="210" height="66" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="154" y="234" fill="#166534" font-size="18">Config</text>
    <rect x="100" y="348" width="210" height="66" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/><text x="154" y="390" fill="#92400e" font-size="18">Logging</text>
    <rect x="890" y="174" width="210" height="66" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="934" y="216" fill="#5b21b6" font-size="18">NetworkProbe</text>
    <rect x="890" y="286" width="210" height="66" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="950" y="328" fill="#075985" font-size="18">Worker</text>
    <rect x="890" y="398" width="210" height="66" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="940" y="440" fill="#991b1b" font-size="18">HardwareIO</text>
  </g>
  <g stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M310 225l142 65"/><path d="M310 381l142-65"/>
    <path d="M748 292l142-85"/><path d="M748 312h142"/><path d="M748 334l142 98"/>
  </g>
  <rect x="442" y="458" width="318" height="54" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="488" y="492" fill="#334155" font-family="Arial, sans-serif" font-size="18" font-weight="700">RAII handles own file descriptors and cleanup</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker></defs>
</svg>
